<span
  #link
  class="popup-topic-link"
  (pointerdown)="togglePopup($event)"
  ><ng-content
/></span>
<div class="popup-container">
  @if (renderPopup) {
    <div
      #popup
      class="popup"
    >
      <help-topic
        [containerType]="'popup-content'"
        [visibleTopicId]="name"
      ></help-topic>
    </div>
  }
</div>
