<jqxWindow
  #dialog
  [isModal]="true"
  [autoOpen]="false"
  [width]="width"
  [height]="height"
>
  <div
    #header
    class="header"
    [innerHTML]="sanitizedHeaderHtml"
  ></div>
  <div class="content">
    @if (contentHtml) {
      <div
        class="textContent"
        [innerHTML]="sanitizedContentHtml"
      ></div>
    } @else {
      <div class="textContent">
        <ng-content></ng-content>
      </div>
    }
    <div class="buttons">
      @if (rememberKey) {
        <div class="left-button">
          <jqxCheckBox #rememberCheckbox> Remember and don't ask again </jqxCheckBox>
        </div>
      }
      @for (button of buttons; track button) {
        <div>
          <jqxButton
            [width]="buttonWidth"
            (onClick)="handleButtonClick(button)"
            >{{ buttonInfo[button] }}</jqxButton
          >
        </div>
      }
    </div>
  </div>
</jqxWindow>
